name = "crocheted-dream"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Required Cloudflare secrets (set in dashboard or with wrangler secret put):
# ADMIN_USERNAME
# ADMIN_PASSWORD
# ADMIN_SESSION_SECRET

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "crocheteddream"
database_id = "4798a9ac-0bf6-4010-ba2e-b1fc2347ea60"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "a-crocheted-dream-product-images"
